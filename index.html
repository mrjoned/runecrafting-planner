<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runecrafting Hub</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#000;color:#fff}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff}.hub-header{max-width:1320px;margin:auto;padding:30px 20px 6px}.eyebrow{font-size:.78rem;color:#f4a0cc;letter-spacing:.13em;font-weight:800}.hub-header h1{font-size:clamp(1.8rem,4vw,3.2rem);margin:8px 0}.subtitle{color:#b9c0ce;margin:0 0 20px;line-height:1.6}.nav{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 18px}.nav-btn{border:1px solid #596176;background:#171c28;color:#fff;border-radius:11px;padding:12px 16px;font:600 .94rem inherit;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}.nav-btn:hover,.nav-btn:focus-visible{background:#343044;border-color:#E96AA9;color:#fff;outline:none}.nav-btn[aria-selected="true"]{background:#E96AA9;border-color:#E96AA9;color:#fff}.symbol{font-size:1.1rem}.workspace{max-width:1400px;margin:auto;padding:0 12px 28px}.tool-frame{width:100%;height:1100px;display:block;border:0;background:#000;border-radius:12px}.tool-frame[hidden]{display:none}.footer{padding:14px 20px 30px;color:#858d9e;text-align:center;font-size:.83rem}@media(max-width:650px){.hub-header{padding:18px 12px 4px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.nav-btn{padding:11px 9px;font-size:.83rem;justify-content:center}.nav-btn:last-child{grid-column:1/-1}.workspace{padding:0 3px 20px}}
</style></head><body><header class="hub-header"><div class="eyebrow">RUNECRAFTING TOOLS</div><h1>Runecrafting Hub</h1><p class="subtitle">Everything you need to discover, compare, plan, and craft enchantments in one place.</p><nav class="nav" role="tablist" aria-label="Runecrafting tools"><button type="button" class="nav-btn" data-tool="planner" aria-selected="true" role="tab"><span class="symbol">⚒</span><span>Build Planner</span></button><button type="button" class="nav-btn" data-tool="encyclopedia" aria-selected="false" role="tab"><span class="symbol">📖</span><span>Encyclopedia</span></button><button type="button" class="nav-btn" data-tool="calculator" aria-selected="false" role="tab"><span class="symbol">🧮</span><span>Rune Calculator</span></button><button type="button" class="nav-btn" data-tool="guide" aria-selected="false" role="tab"><span class="symbol">🛡</span><span>Equipment Guide</span></button><button type="button" class="nav-btn" data-tool="comparison" aria-selected="false" role="tab"><span class="symbol">⚖</span><span>Comparison</span></button></nav></header><main class="workspace"><iframe title="Build Planner" id="frame-planner" class="tool-frame" loading="eager" ></iframe><iframe title="Encyclopedia" id="frame-encyclopedia" class="tool-frame" loading="lazy" hidden></iframe><iframe title="Rune Calculator" id="frame-calculator" class="tool-frame" loading="lazy" hidden></iframe><iframe title="Equipment Guide" id="frame-guide" class="tool-frame" loading="lazy" hidden></iframe><iframe title="Comparison" id="frame-comparison" class="tool-frame" loading="lazy" hidden></iframe></main><footer class="footer">Runecrafting Hub · Data syncs with Airtable when hosted with the existing Netlify Function.</footer><script>
const toolData={planner:"hub_build_planner.html",encyclopedia:"hub_encyclopedia.html",calculator:"hub_rune_calculator.html",guide:"hub_equipment_guide.html",comparison:"hub_comparison.html"};
const toolMeta={"planner": {"name": "Build Planner", "description": "Plan enchantments and rune costs"}, "encyclopedia": {"name": "Encyclopedia", "description": "Browse enchantments and recipes"}, "calculator": {"name": "Rune Calculator", "description": "Calculate rune requirements"}, "guide": {"name": "Equipment Guide", "description": "Find enchantments by equipment"}, "comparison": {"name": "Comparison", "description": "Compare enchantments side by side"}};
const buttons=[...document.querySelectorAll('[data-tool]')];
const loaded=new Set();
function loadTool(key){if(loaded.has(key))return;const frame=document.getElementById('frame-'+key);frame.src=toolData[key];loaded.add(key);frame.addEventListener('load',()=>resizeFrame(frame));}
function resizeFrame(frame){if(frame.hidden)return;try{const doc=frame.contentDocument;if(!doc)return;const height=Math.max(doc.body?.scrollHeight||0,doc.documentElement?.scrollHeight||0);if(height>200)frame.style.height=(height+28)+'px'}catch(e){}}
function activate(key,updateHash=true){if(!toolData[key])key='planner';buttons.forEach(b=>{const active=b.dataset.tool===key;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1});document.querySelectorAll('.tool-frame').forEach(f=>f.hidden=f.id!=='frame-'+key);loadTool(key);resizeFrame(document.getElementById('frame-'+key));if(updateHash)history.replaceState(null,'','#'+key)}
buttons.forEach(b=>b.addEventListener('click',()=>activate(b.dataset.tool)));
window.addEventListener('hashchange',()=>activate(location.hash.slice(1),false));
setInterval(()=>{const key=document.querySelector('.nav-btn[aria-selected="true"]')?.dataset.tool;if(key)resizeFrame(document.getElementById('frame-'+key))},900);
activate(location.hash.slice(1)||'planner',false);
</script></body></html>
